[workspace]
members = [
    "crates/muvera-core",
    "crates/muvera-py",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["MUVERA contributors"]
repository = "https://github.com/sylziyuz/muvera"

[workspace.dependencies]
rand = "0.8.5"
rand_distr = "0.4.3"
thiserror = "1.0.69"
pyo3 = { version = "0.23.4", features = ["abi3-py39", "extension-module"] }
diskann = "0.49.1"
diskann-providers = "0.49.1"
diskann-vector = "0.49.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.8"
